name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: tax_database
          POSTGRES_USER: tax_assistant
          POSTGRES_PASSWORD: 1234  # throwaway database for the tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tax_assistant"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://tax_assistant:1234@localhost:5432/tax_database
          SECRET_KEY: ci-test-secret
        run: |
          source venv/bin/activate
          pytest

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Pushing to Docker Hub needs the DOCKER_USERNAME and DOCKER_PASSWORD repository secrets.
      # Without them, the image is still built (to check the Dockerfile) but not pushed.
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push if Docker Hub is configured)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.DOCKER_USERNAME != '' }}
          tags: ${{ env.DOCKER_USERNAME != '' && format('{0}/tax_filing_assistant:{1}', env.DOCKER_USERNAME, github.sha) || format('tax_filing_assistant:{0}', github.sha) }}
