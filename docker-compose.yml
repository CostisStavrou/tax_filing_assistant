services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tax_assistant:1234@db:5432/tax_database  # local development only
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: tax_database
      POSTGRES_USER: tax_assistant
      POSTGRES_PASSWORD: 1234  # local development only
    ports:
      - "5432:5432"  # Expose PostgreSQL to host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_assistant -d tax_database"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
